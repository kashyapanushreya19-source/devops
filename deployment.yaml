apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-demo

    spec:
      containers:
      - name: nginx
        image: devops-demo:v1
        ports:
        - containerPort: 80