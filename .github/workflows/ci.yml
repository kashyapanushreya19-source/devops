name: Simple CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write   #  THIS FIXES PERMISSION ERROR

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run a simple command
        run: echo "This is my pipeline run"
      
      - name: Step1
        run: echo "This is my Step1"
      
      - name: Step2
        run: echo "This is my Step2"

      - name: Step3
        run: echo "This is my Step3"

      - name: PipelineBreak
        run: echo "PipelineBreak"

      #   GHCR login
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      #  Build image
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.actor }}/devops:v1 .

      #  Push SAME image
      - name: Push Docker image
        run: docker push ghcr.io/${{ github.actor }}/devops:v1