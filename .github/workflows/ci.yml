name : Simple CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run a simple command
        run: echo "This is my pipeline run"
      
      - name: Step1
        run: echo "This is my Step1"
      
      - name: Step2
        run: echo "This is my Step2"

      - name: Step3
        run: echo "This is my Step3"

      - name: PipelineBreak
        run: echo "PipelineBreak"

      - name: ghcr login to 
        run: echo"${{secrets.ghcr_token}} | docker login ${{ github.actor }} --password-stdin"

      - name: build a docker image
        run: docker build -t ghcr.io/${{github.actor}}/devops:v1 .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.actor }}/my-app:latest

      
